name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build-cmd: build:linux
            artifact-name: sellserv-voice-linux
            artifact-path: |
              desktop/dist/*.deb
              desktop/dist/*.AppImage
              desktop/dist/*.pacman
              desktop/dist/latest-linux.yml
          - os: windows-latest
            build-cmd: build:win
            artifact-name: sellserv-voice-windows
            artifact-path: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/*.appx
              desktop/dist/latest.yml
          - os: macos-latest
            build-cmd: build:mac
            artifact-name: sellserv-voice-macos
            artifact-path: |
              desktop/dist/*.dmg
              desktop/dist/*.dmg.blockmap
              desktop/dist/latest-mac.yml

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install npm dependencies
        run: npm install

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('desktop/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build client
        run: npm run build

      - name: Build Electron app
        run: npm run ${{ matrix.build-cmd }}
        working-directory: desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
          append_body: true
          body: |

            ## Release Checklist
            - [ ] Microsoft Store approved

            > Publish this release once the Store submission is live.

  submit-store:
    needs: [build]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: sellserv-voice-windows
          path: artifacts

      - name: Install Microsoft Store Developer CLI
        run: winget install "Microsoft Store Developer CLI" --accept-source-agreements --accept-package-agreements

      - name: Configure Store credentials
        run: echo y | msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Find appx file
        id: find-appx
        shell: bash
        run: |
          APPX_FILE=$(find artifacts -name "*.appx" | head -1)
          echo "file=$APPX_FILE" >> "$GITHUB_OUTPUT"

      - name: Submit to Microsoft Store
        run: msstore publish "${{ steps.find-appx.outputs.file }}" --appId 9NTD3XLC0JRJ
