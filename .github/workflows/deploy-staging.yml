name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/sellserv/voice-server:staging

      - name: Build and push admin-console staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: admin-console/Dockerfile
          push: true
          tags: ghcr.io/sellserv/admin-console:staging

      - name: Deploy to staging server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            cd /opt/voip-server-staging/deploy/production

            # Pull latest images and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for app to be healthy
            sleep 5
            for i in $(seq 1 12); do
              STATUS=$(docker compose ps app --format '{{.Health}}' 2>/dev/null)
              if [ "$STATUS" = "healthy" ]; then
                echo "Staging deploy successful"
                exit 0
              fi
              echo "Waiting for app to be healthy (attempt $i)... status: $STATUS"
              sleep 5
            done
            echo "STAGING DEPLOY FAILED — app not healthy after 60s"
            docker compose logs --tail=40 app
            exit 1
