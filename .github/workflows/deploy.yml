name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            cd /opt/voip-server

            # Pull latest deploy config
            git fetch origin main
            git checkout origin/main -- deploy/production/

            cd deploy/production

            # Pull latest images and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for app to be healthy
            sleep 5
            for i in $(seq 1 12); do
              STATUS=$(docker compose ps app --format '{{.Health}}' 2>/dev/null)
              if [ "$STATUS" = "healthy" ]; then
                echo "Deploy successful"
                exit 0
              fi
              echo "Waiting for app to be healthy (attempt $i)... status: $STATUS"
              sleep 5
            done
            echo "DEPLOY FAILED — app not healthy after 60s"
            docker compose logs --tail=40 app
            exit 1
