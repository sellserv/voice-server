name: Tests

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long-for-ci
          DB_PATH: ':memory:'
