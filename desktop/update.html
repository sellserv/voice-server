<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SellServ Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #08080f;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      border-radius: 14px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }

    .status {
      font-size: 12px;
      color: #8b8ba0;
      margin-bottom: 10px;
      min-height: 16px;
    }

    .progress-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #7c5cfc;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-bar.indeterminate {
      width: 30%;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(350%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <img class="icon" src="icons/64x64.png" alt="">
  <div class="title">SellServ Voice</div>
  <div class="status" id="status">Checking for updates...</div>
  <div class="progress-track">
    <div class="progress-bar indeterminate" id="progress"></div>
  </div>

  <script>
    window.updateAPI.onStatus((text) => {
      document.getElementById('status').textContent = text;
    });

    window.updateAPI.onProgress((percent) => {
      const bar = document.getElementById('progress');
      bar.classList.remove('indeterminate');
      bar.style.width = Math.round(percent) + '%';
    });
  </script>
</body>
</html>
