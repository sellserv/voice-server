services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - sellserv

  sellserv:
    image: ghcr.io/sellserv/voice-server:latest
    restart: unless-stopped
    ports:
      - "40000-40100:40000-40100/udp"
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    env_file:
      - .env

volumes:
  data:
  uploads:
  caddy-data:
  caddy-config:
