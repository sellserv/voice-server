services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CERT_PATH:-/etc/ssl/voip-server}:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    depends_on:
      - app
      - admin-console
      - livekit

  app:
    image: ghcr.io/sellserv/voice-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  admin-console:
    image: ghcr.io/sellserv/admin-console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      API_URL: http://app:3000
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      - app

  postgres:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sellserv
      POSTGRES_USER: sellserv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellserv"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

volumes:
  pgdata:
  valkey-data:
  caddy-data:
  caddy-config:
