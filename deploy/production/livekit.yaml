# LiveKit Server Configuration
# See https://docs.livekit.io/realtime/self-hosting/deployment/
#
# IMPORTANT: The API key and secret below MUST match LIVEKIT_API_KEY
# and LIVEKIT_API_SECRET in your .env file.

port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  # Format: api_key: api_secret
  # Replace with your actual values (must match .env)
  your-api-key: your-api-secret
logging:
  level: info
